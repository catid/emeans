[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emeans"
version = "0.1.0"
description = "Reproduction of Meta FAIR's e-means clustering algorithm and e-means++ (principled synthesis of k-means++ initialization with EMA mini-batch clustering)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "torch>=2.4",
  "triton>=3.0",
  "faiss-cpu>=1.8",
  "matplotlib>=3.8",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
